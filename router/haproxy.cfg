# Failover proxy: VPS primary, home ntfy as backup. Every value comes from config.env.
# On OPNsense, enter the same settings in the HAProxy plugin GUI (see README);
# on any Linux box, `docker compose up -d` in this folder runs exactly this file.

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 15s
    timeout server 15s
    retries 1

resolvers sys
    parse-resolv-conf
    hold valid 60s

frontend ntfy_in
    bind "${PROXY_LISTEN}"
    default_backend ntfy

backend ntfy
    # Health: /v1/health on both servers. fastinter = quicker checks while a server is changing state.
    option httpchk
    http-check send meth GET uri /v1/health hdr Host "${NTFY_VPS_HOST}"
    http-check expect string healthy
    default-server inter "${CHECK_INTERVAL}" fastinter 1s fall 2 rise 2

    # ntfy doesn't care about Host, but Caddy on the VPS routes by it.
    http-request set-header Host "${NTFY_VPS_HOST}"

    # Outage before the health check notices: the first failed connection to the VPS marks it
    # down (on-error mark-down) and the request is retried on the home server (redispatch).
    # Only connection failures are retried, so a POST is never delivered twice.
    option redispatch
    retries 2

    # init-addr none: start even when DNS is down (WAN outage) - the VPS stays marked down until it resolves.
    server vps "${NTFY_VPS_HOST}:443" ssl verify required ca-file "${CA_FILE}" sni env(NTFY_VPS_HOST) check check-sni "${NTFY_VPS_HOST}" resolvers sys init-addr last,libc,none observe layer4 error-limit 1 on-error mark-down
    server home "${NTFY_HOME_ADDR}" check backup
