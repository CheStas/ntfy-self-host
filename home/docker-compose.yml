# All settings come from config.env (committed) and secrets.env (generated by ../init.sh).
services:
  ntfy:
    image: binwiederhier/ntfy:v2.14.0
    command: serve
    restart: unless-stopped
    env_file: [config.env, secrets.env]
    ports:
      - "8080:80"
    volumes:
      - ./data/cache:/var/cache/ntfy
      - ./data/lib:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -q healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  backfill:
    image: node:24.22.1-alpine
    command: node /app/backfill.mjs
    restart: unless-stopped
    env_file: [config.env, secrets.env]
    volumes:
      - ./backfill:/app:ro
      - ./data/backfill:/data
    depends_on:
      ntfy:
        condition: service_healthy
